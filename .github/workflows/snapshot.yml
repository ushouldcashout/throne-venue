name: venue snapshot
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.mjs
      - name: commit if changed
        run: |
          git config user.name "throne-venue-bot"
          git config user.email "bot@throne.network"
          git add data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
